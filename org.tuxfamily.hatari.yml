app-id: org.tuxfamily.hatari
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: hatari
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --device=all
  - --filesystem=xdg-download
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
modules:
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/PortAudio/portaudio.git
        tag: v19.7.0
        commit: 147dd722548358763a8b649b3e4b41dfffbcfbb6

  - name: capsimage
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/simonowen/capsimage
        tag: 5.1
        commit: cd790da49cced3e0b0a6eec7ab52ee24f45a28b2

  - name: hatari
    buildsystem: cmake-ninja
    license-files:
      - gpl.txt
    post-install:
      - install -Dm644 ${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.appdata.xml -t /app/share/appdata/
    cleanup:
      - hatari.desktop
      - '*.application-x-st-disk-image.*'
    sources:
      - type: git
        url: https://github.com/hatari/hatari.git
        tag: v2.6.1
        commit: 6a8e26d69fb32d61efd398dc1ad9a77122400034
      - type: patch
        paths:
          - patches/use_xdg_config_home.patch
          - patches/rename-files.patch
      - type: file
        path: org.tuxfamily.hatari.desktop
      - type: file
        path: org.tuxfamily.hatari.svg
      - type: file
        path: org.tuxfamily.hatari.appdata.xml

  - name: tos
    buildsystem: simple
    build-commands:
      - install -Dm444 *.img /app/share/hatari/
    sources:
      - type: file
        path: tos.img
      - type: file
        path: etos256us.img
      - type: file
        path: etos512us.img
      - type: file
        path: etos1024us.img
